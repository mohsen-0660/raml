<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>محاسبه زایجه رمل</title>

    <style>
      @font-face {
        font-family: vazir;
        src: url(fonts/Vazir.woff);
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #002855;
        direction: rtl;
        display: flex;
        justify-content: center;
      }

      /* هرکدام از دو سمت اصلی صفحه */
      .asli {
        text-align: center;
        margin: auto 20px;
        margin-top: 7px;
        padding: 1%;
        border-radius: 5px;
        width: 95%;
        max-width: 500px;
        min-width: 350px;

        height: 100%;
        background-color: #6e8cc7;
        display: flex;
        flex-direction: column;
      }

      /* بخش اشکال */
      .in-ashkal {
        width: 95%;
        margin: auto;
      }

      /* قسمت بالای بخش اشکال */
      #input {
        height: 180px;
        background-color: #b8c0ff;
        border: 3px dashed #0353a4;
        border-radius: 10px;
      }

      #input p {
        font-family: "vazir";
        font-size: 17px;
        font-weight: bold;
        margin: 15px auto;
      }

      /* فیلد ورودی */
      #vorodi {
        text-align: center;
        width: 80%;
        max-width: 280px;
        font-size: 25px;
        border-style: none;
        border-radius: 10px;
        background-color: #cbd1ff;
        border-bottom: 2px solid #0353a4;
      }

      a {
        color: #1a27e0;
        text-decoration: none;
      }

      /* باکس کتابخانه */
      .library-link {
        width: 88%;
        margin: 8px auto 10px;
        padding: 9px 10px;
        background: linear-gradient(135deg, #dfe7ff, #cbd8ff);
        border: 2px solid #6f8fd4;
        border-radius: 12px;
        box-sizing: border-box;
        font-family: vazir;
        font-size: 13px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        flex-wrap: wrap;
        box-shadow: 0 3px 7px rgba(0, 0, 0, 0.15);
      }

      .library-icon {
        font-size: 18px;
      }

      .library-text {
        color: #263b73;
      }

      .library-link a {
        color: #075eaa;
        background: #ffffff;
        padding: 4px 10px;
        border-radius: 7px;
        border: 1px solid #8ba4dc;
        font-weight: bold;
        transition: all 0.2s ease;
      }

      .library-link a:hover {
        background: #aec3ff;
        color: #003c78;
        transform: scale(1.04);
      }

      /* قسمت پایین بخش اشکال */
      #boyot {
        margin-top: 5px;
        background-color: #bbd0ff;
        height: 85%;
        border: 3px dashed #0353a4;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        padding: 4px 0;
      }

      /* هر سطر */
      .satr {
        border: 2px dashed #0466c8;
        border-radius: 5px;
        margin: 2px auto;
        width: 95%;
        height: 19%;
        display: flex;
      }

      #satr-1 {
        margin: 2px auto;
        width: 97%;
        height: 19%;
        display: flex;
      }

      .nim-satr {
        height: 96%;
        width: 48%;
      }

      /* هر بیت */
      .beyt {
        margin: 6px auto;
        width: 50px;
        height: 120px;
        border-radius: 10px;
      }

      .show_border {
        border: 1px solid #78a1d1;
      }

      /* شماره خانه ها */
      .shomare_khane {
        margin: 0;
        background-color: #78a1d1;
        color: #3f3f9a;
        border-top-left-radius: 5px;
        border-top-right-radius: 5px;
        margin-bottom: 10px;
        font-family: vazir;
        font-size: 14px;
        font-weight: bold;
      }

      /* ساخت نقطه و خط */
      .adad {
        width: 8px;
        height: 8px;
        background-color: black;
        margin: 5px auto;
        border-radius: 10px;
      }

      .s1 {
        width: 25px;
      }

      .red {
        background-color: red;
      }

      .green {
        background-color: #00ff00;
      }

      /* نوشتن نام هر شکل زیرش */
      .nam {
        margin-top: 5px;
      }

      .nam p {
        font-family: vazir;
        font-size: 12px;
        font-weight: bolder;
        margin-top: 4px;
      }
    </style>
  </head>

  <body>
    <div id="ashkal" class="asli">

      <div id="input" class="in-ashkal">

        <p>به جای نقطه 0 و به جای خط 1 را وارد کنید</p>

        <input
          type="text"
          name=""
          id="vorodi"
          maxlength="16"
          placeholder="...110101"
        />

        <p>
          <span>سازنده : mohsen0660@ (</span>

          <a
            href="https://eitaa.com/mohsen0660"
            target="_blank"
          >ایتا</a>

          <span>/</span>

          <a
            href="https://t.me/mohsen0660"
            target="_blank"
          >تلگرام</a>

          <span>)</span>
        </p>

        <!-- لینک کتابخانه -->
        <div class="library-link">
          <span class="library-icon">📚</span>

          <span class="library-text">
            کتابخانه تخصصی علم رمل در تلگرام
          </span>

          <a
            href="https://t.me/+on5KK8q4OLY5ZjQ0"
            target="_blank"
          >
            مشاهده کانال
          </a>
        </div>

      </div>

      <div id="boyot" class="in-ashkal">

        <div class="" id="satr-1">

          <div class="satr nim-satr" id="satr-1.1">
            <div class="beyt" id="beyt-1"></div>
            <div class="beyt" id="beyt-2"></div>
            <div class="beyt" id="beyt-3"></div>
            <div class="beyt" id="beyt-4"></div>
          </div>

          <div class="satr nim-satr" id="satr-1.2">
            <div class="beyt" id="beyt-5"></div>
            <div class="beyt" id="beyt-6"></div>
            <div class="beyt" id="beyt-7"></div>
            <div class="beyt" id="beyt-8"></div>
          </div>

        </div>

        <div class="satr" id="satr-2">
          <div class="beyt" id="beyt-9"></div>
          <div class="beyt" id="beyt-10"></div>
          <div class="beyt" id="beyt-11"></div>
          <div class="beyt" id="beyt-12"></div>
        </div>

        <div class="satr" id="satr-3">
          <div class="beyt" id="beyt-13"></div>
          <div class="beyt" id="beyt-14"></div>
        </div>

        <div class="satr" id="satr-4">
          <div class="beyt" id="beyt-15"></div>
        </div>

        <div class="satr" id="satr-5">
          <div class="beyt" id="beyt-16"></div>
        </div>

      </div>
    </div>

    <script>
      // جدول اشکال

      let jadval_ashkal = [
        { id: 1, shekl: "0111", nam: "لحیان", tozih: "" },
        { id: 2, shekl: "1010", nam: "قبض الداخل", tozih: "" },
        { id: 3, shekl: "0101", nam: "قبض الخارج", tozih: "" },
        { id: 4, shekl: "1111", nam: "جماعت", tozih: "" },
        { id: 5, shekl: "0010", nam: "فراخ", tozih: "" },
        { id: 6, shekl: "0110", nam: "عقلة", tozih: "" },
        { id: 7, shekl: "1110", nam: "انگیس", tozih: "" },
        { id: 8, shekl: "1011", nam: "حمره", tozih: "" },
        { id: 9, shekl: "1101", nam: "بیاض", tozih: "" },
        { id: 10, shekl: "0011", nam: "نصرة الخارج", tozih: "" },
        { id: 11, shekl: "1100", nam: "نصرة الداخل", tozih: "" },
        { id: 12, shekl: "0001", nam: "عتبة الخارج", tozih: "" },
        { id: 13, shekl: "0100", nam: "نقی الخد", tozih: "" },
        { id: 14, shekl: "1000", nam: "عتبة الداخل", tozih: "" },
        { id: 15, shekl: "1001", nam: "اجتماع", tozih: "" },
        { id: 16, shekl: "0000", nam: "طریق", tozih: "" },
      ];

      let $ = document;

      let input_fild = $.getElementById("vorodi");

      input_fild.addEventListener("keyup", function () {
        var text = input_fild.value;

        if (text.length == 16) {
          input_fild.style.backgroundColor = "rgb(158 243 158)";

          // ریختن نتیجه حساب اعداد در لیست
          let abvab = hesab(text);

          // فرستادن لیست برای ساخت اشکال
          data_print(abvab);

          // انجام روش سیر نقطه
          // seyr_noghte(abvab)
        } else {
          input_fild.style.backgroundColor = "";
        }

        for (let i in text) {
          if (!(text[i] == "0" || text[i] == "1")) {
            input_fild.value = text.slice(0, i);
          }
        }
      });

      // ضرب برای ساخت خانه های 9 تا 16
      function zarb(by1, by2) {
        let by3 = "";

        for (let i = 0; i != 4; i++) {
          by3 += String(
            Math.abs(((+by1[i] + +by2[i]) * 2 - 2) / 2)
          );
        }

        return by3;
      }

      // فانکشن حساب
      function hesab(text) {

        // ساخت امهات یعنی 1 تا 4
        var lst = [
          text.slice(0, 4),
          text.slice(4, 8),
          text.slice(8, 12),
          text.slice(12, 16),
        ];

        // ساخت بنات یعنی 5 تا 8
        for (let i in lst) {
          lst.push(
            lst[0][i] +
            lst[1][i] +
            lst[2][i] +
            lst[3][i]
          );
        }

        // ساخت متولدات یعنی 9 تا 12
        for (let i = 0; i != 8; i += 2) {
          lst.push(zarb(lst[i], lst[i + 1]));
        }

        // ساخت خانه های 13 تا 15
        for (let i = 8; i != 14; i += 2) {
          lst.push(zarb(lst[i], lst[i + 1]));
        }

        // ساخت خانه 16
        lst.push(zarb(lst[14], lst[0]));

        console.log(lst);

        return lst;
      }

      // رسم زایچه با استفاده از لیست اشکال حساب شده
      function data_print(abvab) {

        for (let i = 1; i != 17; i++) {

          // تعریف متغیر برای هر یک از المنت های بیت
          this["beyt_" + i] =
            $.getElementById("beyt-" + i);

          // حذف کلاس ها از بیت ها و افزودن دوباره کلاس ها
          this["beyt_" + i].removeAttribute("class");

          this["beyt_" + i].classList.add(
            "beyt",
            "show_border"
          );

          // خالی کردن هر خانه
          this["beyt_" + i].innerText = "";

          // نوشتن شماره خانه بالای آن
          this["beyt_" + i].insertAdjacentHTML(
            "afterbegin",
            '<div class="shomare_khane">' +
              i +
            "</div>"
          );

          // گرفتن شکل از لیست
          var bab = abvab[i - 1];

          // ساخت نقطه و خط بر اساس شکل انتخاب شده
          for (let s in bab) {
            this["beyt_" + i].insertAdjacentHTML(
              "beforeend",
              '<div class="adad s' +
                bab[s] +
              '"></div>'
            );
          }

          // پیدا کردن این شکل از جدول اشکال برای یافتن نام آن
          var natije = jadval_ashkal.find(function (item) {
            return item["shekl"] == bab;
          });

          // نوشتن نام شکل پیدا شده زیر آن
          this["beyt_" + i].insertAdjacentHTML(
            "beforeend",
            '<div class="nam"><p>' +
              natije.nam +
            "</p></div>"
          );
        }

        console.log();
      }
    </script>
  </body>
</html>
